name: Ingestion Rollout Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Static messages only. No external input, network or secret access.
      - name: Require verified observability before arming canary
        run: |
          printf '%s\n' '## Canary not armed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'No scheduled ingestion or privileged watchdog queries run from this workflow.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Blocked: provision a least-privilege telemetry endpoint, validate gateway auth and atomic dispatch acceptance, then review a finite rollout window.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '::error::INGESTION_ROLLOUT_NOT_READY'
          exit 1
